name: paypulse-stream

services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    container_name: paypulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - ./data/kafka:/tmp/kraft-combined-logs.       
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.2
    container_name: paypulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic "$${KAFKA_TOPIC}" \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --describe \
          --topic "$${KAFKA_TOPIC}"
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-payment_events}
    restart: "no"


  postgres:
    image: postgres:17-alpine
    hostname: postgres
    container_name: paypulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paypulse}
      POSTGRES_USER: ${POSTGRES_USER:-paypulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  webhook-api:
    build:
      context: ./webhook_service
    container_name: paypulse-webhook-api
    ports:
      - "8000:8000"
    environment:
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-payment_events}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  spark-processor:
    build:
      context: ./spark_processor
    container_name: paypulse-spark-processor
    environment:
      HOME: /tmp
      IVY_HOME: /tmp/.ivy2
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-payment_events}
      POSTGRES_DB: ${POSTGRES_DB:-paypulse}
      POSTGRES_USER: ${POSTGRES_USER:-paypulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SPARK_CHECKPOINT_ROOT: /app/data/checkpoints
      SPARK_REJECTED_PATH: /app/data/rejected
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      #- pipeline_data:/app/data. #old
      #- spark_ivy_cache:/tmp/.ivy2 #old
      - ./data/checkpoints:/app/data/checkpoints #new from here
      - ./data/rejected:/app/data/rejected
      - spark_ivy_cache:/tmp/.ivy2
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    container_name: paypulse-dashboard
    ports:
      - "8501:8501"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paypulse}
      POSTGRES_USER: ${POSTGRES_USER:-paypulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-5}
      DASHBOARD_DEFAULT_CURRENCY: ${DASHBOARD_DEFAULT_CURRENCY:-gbp}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
  pipeline_data:
  spark_ivy_cache:

# Purpose: Docker Compose starts every local service on one private network and in dependency order.
