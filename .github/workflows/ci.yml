name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            webhook_service/requirements.txt
            dashboard/requirements.txt
            scripts/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r webhook_service/requirements.txt
          python -m pip install -r dashboard/requirements.txt
          python -m pip install -r scripts/requirements.txt

      - name: Lint Python
        run: python -m ruff check .

      - name: Compile Python files
        run: python -m compileall webhook_service spark_processor dashboard scripts

      - name: Run unit tests
        run: python -m pytest

      - name: Validate Docker Compose
        run: docker compose config --quiet

# Purpose: CI blocks broken imports, lint failures, test regressions, and invalid Compose changes.
