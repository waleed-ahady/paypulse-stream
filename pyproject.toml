[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["webhook_service/tests", "spark_processor/tests"]
pythonpath = ["webhook_service", "spark_processor"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
